[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/flow/supervisord.pid

[unix_http_server]
file=/run/flow/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/flow/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:flow-engine]
command=/usr/local/bin/flow service --listen 127.0.0.1:9223 --workers %(ENV_FLOW_SERVICE_WORKERS)s
directory=/var/lib/flow
user=flow
priority=50
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=75
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:flow-api]
command=/opt/venv/bin/flow-agent server --host 0.0.0.0 --port %(ENV_FLOW_API_PORT)s
directory=/var/lib/flow
user=flow
priority=70
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
