# Windows deployment: Chrome profiles run natively on the Windows host.
services:
  flow:
    build:
      context: ../..
      dockerfile: deploy/windows/Dockerfile
    image: flow-agent:windows-host-browser
    container_name: flow-agent
    restart: unless-stopped
    environment:
      FLOW_ENGINE_MODE: service
      FLOW_SERVICE_URL: http://127.0.0.1:9223
      FLOW_BRIDGE_LISTEN_ADDR: 0.0.0.0:9222
      FLOW_DATA_DIR: /var/lib/flow/data
      FLOW_COOKIE_DIR: /var/lib/flow/cookies
      FLOW_OUTPUT_DIR: /var/lib/flow/output
      FLOW_COOKIE_FRESHNESS: ${FLOW_COOKIE_FRESHNESS:-strict}
      FLOW_RECAPTCHA: ${FLOW_RECAPTCHA:-auto}
      FLOW_SERVICE_WORKERS: ${FLOW_SERVICE_WORKERS:-8}
      FLOW_API_PORT: "8001"
      FLOW_INTERNAL_TOKEN: ${FLOW_INTERNAL_TOKEN:-}
    volumes:
      - ../../flow-state:/var/lib/flow
    ports:
      - "127.0.0.1:${FLOW_API_HOST_PORT:-8001}:8001"
      - "127.0.0.1:${FLOW_BRIDGE_HOST_PORT:-9222}:9222"
    stop_grace_period: 90s
