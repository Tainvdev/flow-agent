# Linux all-in-one deployment. This preserves the Chromium/Xvfb/noVNC setup.
services:
  flow:
    build:
      context: ../..
      dockerfile: deploy/linux/Dockerfile
    image: flow-agent:linux
    container_name: flow-agent-linux
    restart: unless-stopped
    environment:
      FLOW_ENGINE_MODE: service
      FLOW_SERVICE_URL: http://127.0.0.1:9223
      FLOW_DATA_DIR: /var/lib/flow/data
      FLOW_COOKIE_DIR: /var/lib/flow/cookies
      FLOW_OUTPUT_DIR: /var/lib/flow/output
      FLOW_COOKIE_FRESHNESS: ${FLOW_COOKIE_FRESHNESS:-strict}
      FLOW_RECAPTCHA: ${FLOW_RECAPTCHA:-broker}
      FLOW_BROWSER_PROFILES: ${FLOW_BROWSER_PROFILES:-profile-1}
      FLOW_SERVICE_WORKERS: ${FLOW_SERVICE_WORKERS:-8}
      FLOW_API_PORT: "8001"
      FLOW_NOVNC_PORT: "6080"
      FLOW_SCREEN_SIZE: ${FLOW_SCREEN_SIZE:-1280x800x24}
      FLOW_INTERNAL_TOKEN: ${FLOW_INTERNAL_TOKEN:-}
    volumes:
      - ../../flow-state:/var/lib/flow
    ports:
      - "127.0.0.1:${FLOW_API_HOST_PORT:-8001}:8001"
      - "127.0.0.1:${FLOW_NOVNC_HOST_PORT:-6080}:6080"
    shm_size: 1gb
    stop_grace_period: 90s
