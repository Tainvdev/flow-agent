[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/flow/supervisord.pid

[unix_http_server]
file=/run/flow/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/flow/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_FLOW_SCREEN_SIZE)s -nolisten tcp
user=flow
priority=10
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openbox]
command=/usr/bin/openbox
user=flow
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/flow"
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -localhost -forever -shared -nopw -rfbport 5900 -ncache 10 -ncache_cr -wait 10 -defer 10
user=flow
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/flow"
priority=30
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/local/bin/start-novnc.sh
user=flow
environment=HOME="/home/flow"
priority=40
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:flow-engine]
command=/usr/local/bin/flow service --listen 127.0.0.1:9223 --workers %(ENV_FLOW_SERVICE_WORKERS)s
directory=/var/lib/flow
user=flow
priority=50
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=75
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:browsers]
command=/usr/local/bin/start-browsers.sh
user=flow
environment=DISPLAY="%(ENV_DISPLAY)s",HOME="/home/flow"
priority=60
autostart=true
autorestart=true
startsecs=10
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:flow-api]
command=/opt/venv/bin/flow-agent server --host 0.0.0.0 --port %(ENV_FLOW_API_PORT)s
directory=/var/lib/flow
user=flow
environment=HOME="/home/flow"
priority=70
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

