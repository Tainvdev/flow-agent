services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - flow_gateway_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: ../..
      dockerfile: deploy/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flow_gateway}
      FLOW_GATEWAY_SECRET: ${FLOW_GATEWAY_SECRET:?set FLOW_GATEWAY_SECRET}
      FLOW_NODE_TOKEN: ${FLOW_NODE_TOKEN:?set FLOW_NODE_TOKEN}
      FLOW_NODE_REQUEST_TIMEOUT: ${FLOW_NODE_REQUEST_TIMEOUT:-15}
      FLOW_NODE_HEARTBEAT_TTL: ${FLOW_NODE_HEARTBEAT_TTL:-45}
      FLOW_API_PORT: 8001
    ports:
      - "${FLOW_API_HOST_PORT:-8001}:8001"

volumes:
  flow_gateway_pgdata:
