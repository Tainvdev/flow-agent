name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and race detector
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-agent/bin/flow-go/flow-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: flow-agent/bin/flow-go/flow-go/go.mod
          cache-dependency-path: flow-agent/bin/flow-go/flow-go/go.sum
      - run: go test -race ./...
      - run: go build ./...

  python:
    name: Python adapter and API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flow-agent/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q flow_agent main.py tests

  extension:
    name: Extension bridge contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/dispatch.test.mjs
